<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 640" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sogaGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1c0e08"/>
      <stop offset="30%" stop-color="#381c10"/>
      <stop offset="70%" stop-color="#4e2817"/>
      <stop offset="100%" stop-color="#2a140a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e08b"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#96721d"/>
    </linearGradient>
    <linearGradient id="redGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8b251a"/>
      <stop offset="100%" stop-color="#3e0f0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Central Handle / Cempurit -->
  <path d="M194,520 L194,635 C194,638 206,638 206,635 L206,520 Z" fill="url(#goldGrad)" stroke="#52360a" stroke-width="1.5"/>
  <line x1="200" y1="520" x2="200" y2="635" stroke="#ffe9a0" stroke-width="1" opacity="0.6"/>

  <!-- Main Gunungan Outline -->
  <g id="gunungan-body">
    <!-- Silhouette Outer -->
    <path d="M 200,20
             C 215,60 270,140 310,210
             C 345,270 375,340 365,420
             C 355,480 300,530 200,530
             C 100,530 45,480 35,420
             C 25,340 55,270 90,210
             C 130,140 185,60 200,20 Z"
          fill="url(#sogaGrad)" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- Inner Border Decorative Rim -->
    <path d="M 200,34
             C 212,70 262,146 298,212
             C 330,270 358,336 348,412
             C 340,466 290,514 200,514
             C 110,514 60,466 52,412
             C 42,336 70,270 102,212
             C 138,146 188,70 200,34 Z"
          fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="6,3" opacity="0.8"/>

    <!-- Sacred Peak (Top Finial) -->
    <circle cx="200" cy="20" r="6" fill="url(#goldGrad)"/>
    <circle cx="200" cy="8" r="3" fill="url(#goldGrad)"/>
    <path d="M 197,20 L 200,2 L 203,20 Z" fill="url(#goldGrad)"/>

    <!-- Padmasana / Base Pedestal -->
    <path d="M120,490 Q200,515 280,490 L275,520 Q200,540 125,520 Z" fill="url(#redGold)" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <path d="M135,496 Q200,516 265,496" fill="none" stroke="#ffd875" stroke-width="1"/>

    <!-- Gapura Paduraksa (The Sacred Temple Gate in the Center) -->
    <g id="gapura">
      <!-- Gate Roof -->
      <path d="M 150,440 L 200,380 L 250,440 L 240,445 L 200,395 L 160,445 Z" fill="url(#goldGrad)" stroke="#3b2203" stroke-width="1"/>
      <!-- Double Doors -->
      <rect x="165" y="435" width="33" height="60" fill="#180b06" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <rect x="202" y="435" width="33" height="60" fill="#180b06" stroke="url(#goldGrad)" stroke-width="1.5"/>
      <!-- Door Ornaments -->
      <circle cx="181" cy="465" r="5" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
      <circle cx="219" cy="465" r="5" fill="none" stroke="url(#goldGrad)" stroke-width="1"/>
      <path d="M170,445 L193,485 M193,445 L170,485" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <path d="M207,445 L230,485 M230,445 L207,485" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.5"/>
      <!-- Kala / Guardian Mask over Gate -->
      <ellipse cx="200" cy="382" rx="16" ry="12" fill="url(#redGold)" stroke="url(#goldGrad)" stroke-width="1.2"/>
      <circle cx="194" cy="380" r="2.5" fill="#ffd875"/>
      <circle cx="206" cy="380" r="2.5" fill="#ffd875"/>
      <path d="M190,388 Q200,393 210,388" stroke="#ffd875" stroke-width="1" fill="none"/>
    </g>

    <!-- Kayu Purwa Maos (Tree of Life Trunk & Branches) -->
    <g id="tree-branches" stroke="url(#goldGrad)" stroke-linecap="round" fill="none">
      <!-- Main Trunk -->
      <path d="M200,370 L200,120" stroke-width="5"/>
      <!-- Lower Major Branches -->
      <path d="M200,340 C 230,330 290,360 320,330 C 335,315 315,290 280,305" stroke-width="2.5"/>
      <path d="M200,340 C 170,330 110,360 80,330 C 65,315 85,290 120,305" stroke-width="2.5"/>

      <!-- Middle Major Branches -->
      <path d="M200,270 C 240,250 280,280 300,240 C 310,220 280,210 250,230" stroke-width="2.5"/>
      <path d="M200,270 C 160,250 120,280 100,240 C 90,220 120,210 150,230" stroke-width="2.5"/>

      <!-- Upper Major Branches -->
      <path d="M200,190 C 230,170 260,190 270,160 C 275,145 250,140 230,155" stroke-width="2"/>
      <path d="M200,190 C 170,170 140,190 130,160 C 125,145 150,140 170,155" stroke-width="2"/>

      <!-- Canopy Top Foliage -->
      <path d="M200,120 C 215,90 240,110 240,90 C 240,75 220,70 200,85" stroke-width="2"/>
      <path d="M200,120 C 185,90 160,110 160,90 C 160,75 180,70 200,85" stroke-width="2"/>
    </g>

    <!-- Intricate Foliage, Flowers & Garuda Birds (Golden Carvings) -->
    <g id="leaves-flowers" fill="url(#goldGrad)" opacity="0.85">
      <!-- Central Rosettes on Branches -->
      <circle cx="200" cy="150" r="7"/>
      <circle cx="200" cy="220" r="8"/>
      <circle cx="200" cy="290" r="9"/>

      <!-- Left Tendrils -->
      <circle cx="140" cy="180" r="5"/>
      <circle cx="110" cy="240" r="6"/>
      <circle cx="80" cy="330" r="6.5"/>
      <circle cx="120" cy="305" r="5"/>
      <circle cx="170" cy="155" r="4.5"/>
      <circle cx="150" cy="230" r="5"/>

      <!-- Right Tendrils -->
      <circle cx="260" cy="180" r="5"/>
      <circle cx="290" cy="240" r="6"/>
      <circle cx="320" cy="330" r="6.5"/>
      <circle cx="280" cy="305" r="5"/>
      <circle cx="230" cy="155" r="4.5"/>
      <circle cx="250" cy="230" r="5"/>

      <!-- Birds / Merak Forest Spirits (Left & Right) -->
      <!-- Left Bird -->
      <path d="M 140,265 C 130,250 115,255 110,270 C 120,275 135,275 140,265 Z"/>
      <path d="M 110,270 Q 95,260 100,250 Q 115,255 110,270 Z" fill="#ffd875"/>

      <!-- Right Bird -->
      <path d="M 260,265 C 270,250 285,255 290,270 C 280,275 265,275 260,265 Z"/>
      <path d="M 290,270 Q 305,260 300,250 Q 285,255 290,270 Z" fill="#ffd875"/>

      <!-- Stylized Monkeys / Kethek -->
      <!-- Left Monkey -->
      <circle cx="155" cy="325" r="4"/>
      <path d="M155,329 Q150,345 160,345" stroke="url(#goldGrad)" stroke-width="1.5" fill="none"/>
      <!-- Right Monkey -->
      <circle cx="245" cy="325" r="4"/>
      <path d="M245,329 Q250,345 240,345" stroke="url(#goldGrad)" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Traditional Flame / Api Blencong Licking Border Accents -->
    <g stroke="url(#goldGrad)" stroke-width="1" fill="none" opacity="0.6">
      <path d="M 90,210 Q 75,230 70,250 Q 85,240 90,210"/>
      <path d="M 310,210 Q 325,230 330,250 Q 315,240 310,210"/>
      <path d="M 60,340 Q 45,360 45,380 Q 60,370 60,340"/>
      <path d="M 340,340 Q 355,360 355,380 Q 340,370 340,340"/>
    </g>
  </g>
</svg>